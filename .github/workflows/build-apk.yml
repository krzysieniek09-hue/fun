name: Build Hardware Info APK

on:
  push:
    branches: ["**"]
    paths:
      - "HardwareInfo/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: HardwareInfo
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: HardwareInfo-debug-apk
          path: HardwareInfo/app/build/outputs/apk/debug/app-debug.apk
